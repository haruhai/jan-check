<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#222222">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JAN検品デモ</title>

<script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f5;
}

header {
  padding: 10px;
  background: #222;
  color: #fff;
  font-size: 16px;
}

#csvArea {
  padding: 10px;
  background: #fff;
}

#scanner {
  height: 45vh;
  background: #000;
}

#list {
  height: 45vh;
  overflow-y: auto;
  padding: 10px;
}

.card {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

.ok {
  border-left: 6px solid #2ecc71;
}

.short {
  border-left: 6px solid #e74c3c;
}

.over {
  border-left: 6px solid #f39c12;
}

.name {
  font-weight: bold;
  font-size: 16px;
}

.qty {
  margin-top: 6px;
  font-size: 15px;
}

.status {
  margin-top: 4px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>JANコード検品</header>

<div id="csvArea">
  <input type="file" id="csvInput" accept=".csv" />
</div>

<div id="scanner"></div>

<div id="list"></div>

<script>
const orders = {};
let lastScan = "";
let lastTime = 0;

document.getElementById("csvInput").addEventListener("change", e => {
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split("\n");
    lines.slice(1).forEach(l => {
      const [jan, name, qty] = l.trim().split(",");
      if (!jan) return;
      orders[jan] = { name, orderQty: +qty, scanQty: 0 };
    });
    render();
    startScanner();
  };
  reader.readAsText(e.target.files[0]);
});

function startScanner() {
  Quagga.init({
    inputStream: {
      type: "LiveStream",
      target: document.querySelector("#scanner"),
      constraints: { facingMode: "environment" }
    },
    decoder: { readers: ["ean_reader"] }
  }, err => {
    if (!err) Quagga.start();
  });

  Quagga.onDetected(res => {
    const jan = res.codeResult.code;
    const now = Date.now();
    if (jan === lastScan && now - lastTime < 1000) return;
    lastScan = jan;
    lastTime = now;

    if (orders[jan]) {
      orders[jan].scanQty++;
      render();
    } else {
      alert("未注文の商品：" + jan);
    }
  });
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  Object.values(orders).forEach(item => {
    let cls = "short";
    let status = "不足";

    if (item.scanQty === item.orderQty) {
      cls = "ok";
      status = "OK";
    } else if (item.scanQty > item.orderQty) {
      cls = "over";
      status = "過剰";
    }

    list.innerHTML += `
      <div class="card ${cls}">
        <div class="name">${item.name}</div>
        <div class="qty">注文 ${item.orderQty} ／ スキャン ${item.scanQty}</div>
        <div class="status">${status}</div>
      </div>
    `;
  });
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
