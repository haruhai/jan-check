<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JAN検品アプリ</title>

<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f2f4f7;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== 上部 ===== */
#topBar {
  padding: 8px;
  background: #fff;
  border-bottom: 1px solid #ddd;
  display: flex;
  gap: 10px;
}

/* ===== 注文明細 ===== */
#orderArea {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.order-item {
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.ok { color: #2e7d32; font-weight: bold; }
.ng { color: #c62828; font-weight: bold; }

/* ===== カメラ ===== */
#cameraArea {
  height: 35vh;
  background: #000;
  position: relative;
}

#scanner {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>

<div id="topBar">
  <input type="file" id="csvInput" accept="text/csv">
  <button onclick="startScanner()">スキャン開始</button>
</div>

<div id="orderArea">
  <h3>注文明細</h3>
  <div id="orderList"></div>
</div>

<div id="cameraArea">
  <div id="scanner"></div>
</div>

<script>
let orders = {};
let scanned = {};
let lastScanTime = {};
const SCAN_INTERVAL = 1500; // ms

/* ===== CSV ===== */
document.getElementById("csvInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => parseCSV(reader.result);
  reader.readAsText(file, "utf-8");
});

function parseCSV(text) {
  orders = {};
  scanned = {};
  lastScanTime = {};

  const lines = text.trim().split(/\r?\n/);
  lines.shift();

  lines.forEach(line => {
    const [jan, name, qty] = line.split(",");
    orders[jan] = { name, qty: Number(qty) };
    scanned[jan] = 0;
  });

  renderOrders();
}

/* ===== 表示 ===== */
function renderOrders() {
  const list = document.getElementById("orderList");
  list.innerHTML = "";

  Object.keys(orders).forEach(jan => {
    const o = orders[jan];
    const s = scanned[jan];
    const ok = s === o.qty;

    list.innerHTML += `
      <div class="order-item">
        <div>
          <div>${o.name}</div>
          <div style="font-size:12px;color:#666;">JAN:${jan}</div>
        </div>
        <div class="${ok ? "ok" : "ng"}">
          ${s} / ${o.qty}
        </div>
      </div>
    `;
  });
}

/* ===== スキャン ===== */
function startScanner() {
  Quagga.init({
    inputStream: {
      type: "LiveStream",
      target: document.querySelector("#scanner"),
      constraints: { facingMode: "environment" }
    },
    decoder: {
      readers: ["ean_reader"]
    }
  }, err => {
    if (err) {
      alert("カメラ起動失敗");
      return;
    }
    Quagga.start();
  });

  Quagga.onDetected(data => {
    const jan = data.codeResult.code;
    const now = Date.now();

    if (!orders[jan]) return;

    if (lastScanTime[jan] && now - lastScanTime[jan] < SCAN_INTERVAL) {
      return;
    }

    lastScanTime[jan] = now;
    scanned[jan]++;
    renderOrders();
  });
}
</script>

</body>
</html>
