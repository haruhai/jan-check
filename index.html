<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JAN検品アプリ</title>

<!-- QuaggaJS（バーコード） -->
<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f2f4f7;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== 上：注文明細 ===== */
#orderArea {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

h2 {
  margin: 6px 0;
}

.order-item {
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.order-left {
  font-size: 14px;
}

.order-right {
  font-weight: bold;
}

.ok {
  color: #2e7d32;
}

.ng {
  color: #c62828;
}

/* ===== 下：カメラ ===== */
#cameraArea {
  height: 35vh;
  background: #000;
  position: relative;
}

#camera {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== 上部操作 ===== */
#topBar {
  display: flex;
  gap: 10px;
  padding: 8px;
  background: #fff;
  border-bottom: 1px solid #ddd;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  background: #1976d2;
  color: #fff;
  font-size: 14px;
}

input[type="file"] {
  font-size: 12px;
}
</style>
</head>

<body>

<div id="topBar">
  <input type="file" id="csvInput" accept="text/csv">
  <button onclick="startScanner()">スキャン開始</button>
</div>

<div id="orderArea">
  <h2>注文明細</h2>
  <div id="orderList"></div>
</div>

<div id="cameraArea">
  <video id="camera"></video>
</div>

<script>
let orders = {};
let scanned = {};

/* ===== CSV読み込み（iPhone対応） ===== */
document.getElementById("csvInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => parseCSV(reader.result);
  reader.readAsText(file, "utf-8");
});

function parseCSV(text) {
  orders = {};
  scanned = {};

  const lines = text.trim().split(/\r?\n/);
  lines.shift(); // ヘッダ削除

  lines.forEach(line => {
    const [jan, name, qty] = line.split(",");
    orders[jan] = {
      name: name,
      qty: Number(qty)
    };
    scanned[jan] = 0;
  });

  renderOrders();
}

/* ===== 表示 ===== */
function renderOrders() {
  const list = document.getElementById("orderList");
  list.innerHTML = "";

  Object.keys(orders).forEach(jan => {
    const item = orders[jan];
    const scanQty = scanned[jan] || 0;
    const ok = scanQty === item.qty;

    const div = document.createElement("div");
    div.className = "order-item";

    div.innerHTML = `
      <div class="order-left">
        <div>${item.name}</div>
        <div style="font-size:12px;color:#666;">JAN: ${jan}</div>
      </div>
      <div class="order-right ${ok ? "ok" : "ng"}">
        ${scanQty} / ${item.qty}
      </div>
    `;
    list.appendChild(div);
  });
}

/* ===== バーコードスキャン ===== */
function startScanner() {
  Quagga.init({
    inputStream: {
      type: "LiveStream",
      target: document.querySelector("#camera"),
      constraints: {
        facingMode: "environment"
      }
    },
    decoder: {
      readers: ["ean_reader"] // JAN(EAN-13)
    }
  }, err => {
    if (err) {
      alert("カメラ起動失敗");
      return;
    }
    Quagga.start();
  });

  Quagga.onDetected(data => {
    const jan = data.codeResult.code;
    if (orders[jan]) {
      scanned[jan]++;
      renderOrders();
    }
  });
}
</script>

</body>
</html>
